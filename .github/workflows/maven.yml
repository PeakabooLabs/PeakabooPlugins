name: Java CI with Maven
run-name: CI build & tests for ${{ github.ref_name }}


on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      peakaboo_ref:
        description: 'Branch, tag, or SHA of upstream Peakaboo to build against'
        required: false
        default: 'master'
        type: string

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v6

    - uses: actions/checkout@v6
      with:
        repository: nsherry4/Peakaboo
        ref: ${{ inputs.peakaboo_ref || 'master' }}
        path: ./Peakaboo

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'temurin'
        cache: maven

    - name: Install base Peakaboo to Maven's local package store
      run: mvn -B install -DskipTests --file pom.xml
      working-directory: ./Peakaboo

    # `verify`, not `package`, so the plugins' own test suites gate the build.
    - name: Build and run tests
      run: mvn -B verify --file pom.xml
