name: Build Plugins Release
run-name: Packaging Peakaboo Plugins v${{ inputs.repo_version }}
# Build plugins into AIO repo zip.

on:
  workflow_dispatch:
    inputs:
      repo_version:
        description: 'Release tag version the app reads from (the X.Y in .../releases/download/vX.Y/)'
        required: true
        default: '6.2'
        type: string
      peakaboo_ref:
        description: 'Branch, tag, or SHA of upstream Peakaboo to build against'
        required: false
        default: 'master'
        type: string
      tooling_release:
        description: 'RepositoryTooling release tag to take the manifest tool from (blank = latest)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:

  package:
    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v6
      with:
        ref: ${{ github.ref }}

    - uses: actions/checkout@v6
      with:
        repository: nsherry4/Peakaboo
        ref: ${{ inputs.peakaboo_ref }}
        path: ./Peakaboo

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'corretto'
        cache: maven

    - name: Install base Peakaboo to Maven's local package store
      run: mvn -B install -DskipTests --file pom.xml
      working-directory: ./Peakaboo

    - name: Build plugins
      run: mvn -B verify --file pom.xml

    # Needs a token with read access to RepositoryTooling, which is private.
    # With no tag, `gh release download` takes the latest release.
    - name: Download the manifest tooling jar
      env:
        GH_TOKEN: ${{ secrets.REPOSITORY_TOOLING_READ_PAT }}
        TOOLING_RELEASE: ${{ inputs.tooling_release }}
      run: |
        mkdir -p tooling
        gh release download $TOOLING_RELEASE \
          --repo PeakabooLabs/RepositoryTooling \
          --pattern 'peakaboo-tooling-*.jar' \
          --dir tooling
        ls -l tooling
      shell: bash

    # Invoke plugin-repo tooling to scan the plugins and generate a contents file.
    # Use the --flat option to rewrite the download urls to use github's flat format
    - name: Generate contents.yaml
      env:
        VERSION: ${{ inputs.repo_version }}
      run: |
        java -jar tooling/peakaboo-tooling-*.jar --flat \
          -d Plugins \
          -u "https://github.com/PeakabooLabs/PeakabooPlugins/releases/download/v$VERSION/" \
          -a "Nathaniel Sherry"
      shell: bash

    - name: Lay out release assets
      run: |
        mkdir -p dist/release
        cp Plugins/*/*.jar Plugins/contents.yaml dist/release/
      shell: bash

    - name: Show release assets
      run: |
        echo "Files to attach to the release:"
        ls -l dist/release
        echo
        echo "contents.yaml:"
        cat dist/release/contents.yaml
      shell: bash

    # Zipped from inside dist/release so unpacking yields the jars and
    # contents.yaml directly, not inside a nested folder.
    - name: Create release zip
      id: zip
      env:
        VERSION: ${{ inputs.repo_version }}
      run: |
        name="PeakabooPlugins-v$VERSION.zip"
        (cd dist/release && zip -r "../$name" .)
        echo "name=$name" >> "$GITHUB_OUTPUT"
        unzip -l "dist/$name"
      shell: bash

    - name: Upload release zip
      uses: actions/upload-artifact@v7
      with:
        name: plugins-repo-v${{ inputs.repo_version }}
        path: dist/${{ steps.zip.outputs.name }}
        retention-days: 14
